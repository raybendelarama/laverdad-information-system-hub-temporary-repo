<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="System placeholder" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#C7D2FE" stroke-width="1" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#grid)"/>

  <!-- connections -->
  <g stroke="#818CF8" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="2 8">
    <path d="M320 240 L140 130"/>
    <path d="M320 240 L500 130"/>
    <path d="M320 240 L140 350"/>
    <path d="M320 240 L500 350"/>
    <path d="M140 130 L140 350"/>
    <path d="M500 130 L500 350"/>
  </g>

  <!-- outer nodes -->
  <g fill="#FFFFFF" stroke="#6366F1" stroke-width="4">
    <rect x="100" y="100" width="80" height="60" rx="12"/>
    <rect x="460" y="100" width="80" height="60" rx="12"/>
    <rect x="100" y="320" width="80" height="60" rx="12"/>
    <rect x="460" y="320" width="80" height="60" rx="12"/>
  </g>
  <g fill="#A5B4FC">
    <rect x="114" y="116" width="36" height="8" rx="4"/>
    <rect x="114" y="132" width="52" height="8" rx="4"/>
    <rect x="474" y="116" width="36" height="8" rx="4"/>
    <rect x="474" y="132" width="52" height="8" rx="4"/>
    <rect x="114" y="336" width="36" height="8" rx="4"/>
    <rect x="114" y="352" width="52" height="8" rx="4"/>
    <rect x="474" y="336" width="36" height="8" rx="4"/>
    <rect x="474" y="352" width="52" height="8" rx="4"/>
  </g>

  <!-- central hub -->
  <circle cx="320" cy="240" r="62" fill="#6366F1"/>
  <circle cx="320" cy="240" r="48" fill="none" stroke="#C7D2FE" stroke-width="3" stroke-dasharray="6 6"/>
  <g fill="#FFFFFF">
    <rect x="296" y="222" width="48" height="10" rx="5"/>
    <rect x="296" y="240" width="48" height="10" rx="5"/>
    <rect x="296" y="258" width="30" height="10" rx="5"/>
  </g>
</svg>